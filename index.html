<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffe9df">
  <title>果漾消消乐 · Fruit Splash</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <!-- SVG 素材库 -->
  <svg class="svg-sprite" aria-hidden="true">
    <defs>
      <linearGradient id="gBerry" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff8299"/><stop offset=".55" stop-color="#ff4d70"/><stop offset="1" stop-color="#dc1f4e"/>
      </linearGradient>
      <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc35c"/><stop offset=".55" stop-color="#ff9d1f"/><stop offset="1" stop-color="#f57b00"/>
      </linearGradient>
      <linearGradient id="gLemon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff49a"/><stop offset=".55" stop-color="#ffdd42"/><stop offset="1" stop-color="#f5bd00"/>
      </linearGradient>
      <linearGradient id="gKiwiSkin" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a6d65c"/><stop offset="1" stop-color="#6c9d31"/>
      </linearGradient>
      <linearGradient id="gKiwiFlesh" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e3fba9"/><stop offset="1" stop-color="#bce977"/>
      </linearGradient>
      <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#87c7ff"/><stop offset=".55" stop-color="#4a8bff"/><stop offset="1" stop-color="#2d59d9"/>
      </linearGradient>
      <linearGradient id="gGrape" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#cf9bff"/><stop offset=".55" stop-color="#a45bf0"/><stop offset="1" stop-color="#762bd1"/>
      </linearGradient>
      <radialGradient id="gHighlight" cx=".3" cy=".2" r=".7">
        <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <symbol id="fruit-0" viewBox="0 0 100 100">
      <path d="M50 27c17 0 31 9 30 25-1 18-17 34-30 42-13-8-29-24-30-42-1-16 13-25 30-25Z" fill="url(#gBerry)"/>
      <path d="M50 29c-4-2-8-5-9-11 5 1 9 4 12 8 3-5 8-8 15-9-2 7-7 11-13 14 7-1 13 0 19 4-7 4-16 4-24 2-8 2-17 2-24-2 6-4 12-5 19-4-6-3-11-7-13-14 7 1 12 4 15 9 3-4 7-7 12-8-1 6-5 9-9 11Z" fill="#55bd5b"/>
      <path d="M50 28c-2-4-1-9 2-13 2 4 2 8 0 12Z" fill="#3d9a45"/>
      <g fill="#ffe9ef" opacity=".95">
        <ellipse cx="38" cy="48" rx="1.7" ry="2.5" transform="rotate(-16 38 48)"/>
        <ellipse cx="60" cy="45" rx="1.7" ry="2.5" transform="rotate(14 60 45)"/>
        <ellipse cx="48" cy="60" rx="1.7" ry="2.5"/>
        <ellipse cx="34" cy="64" rx="1.7" ry="2.5" transform="rotate(-20 34 64)"/>
        <ellipse cx="64" cy="62" rx="1.7" ry="2.5" transform="rotate(20 64 62)"/>
        <ellipse cx="50" cy="74" rx="1.7" ry="2.5"/>
        <ellipse cx="42" cy="80" rx="1.5" ry="2.2" transform="rotate(-18 42 80)"/>
      </g>
      <circle cx="50" cy="55" r="38" fill="url(#gHighlight)" opacity=".4"/>
    </symbol>

    <symbol id="fruit-1" viewBox="0 0 100 100">
      <circle cx="50" cy="56" r="30" fill="url(#gOrange)"/>
      <circle cx="50" cy="56" r="30" fill="none" stroke="#ffd181" stroke-width="1.5" opacity=".5"/>
      <path d="M50 29c2-11 12-17 24-14-1 11-10 18-24 17Z" fill="#55bd5b"/>
      <path d="M50 29c1-10 9-15 18-14-4 8-10 13-18 14Z" fill="#7cd97b" opacity=".6"/>
      <path d="M50 31v-8" stroke="#8a5736" stroke-width="4" stroke-linecap="round"/>
      <g fill="#d9770a" opacity=".4">
        <circle cx="38" cy="48" r="1.3"/><circle cx="58" cy="42" r="1.1"/><circle cx="66" cy="55" r="1.2"/>
        <circle cx="45" cy="71" r="1.1"/><circle cx="62" cy="68" r="1.2"/><circle cx="33" cy="60" r="1"/>
      </g>
      <ellipse cx="38" cy="43" rx="11" ry="6" fill="#fff" opacity=".24" transform="rotate(-32 38 43)"/>
      <circle cx="50" cy="56" r="30" fill="url(#gHighlight)" opacity=".3"/>
    </symbol>

    <symbol id="fruit-2" viewBox="0 0 100 100">
      <g transform="rotate(-18 50 56)">
        <ellipse cx="50" cy="56" rx="29" ry="25" fill="url(#gLemon)"/>
        <path d="M22 56c0-13 12-24 28-25" fill="none" stroke="#fff3a8" stroke-width="3" opacity=".5"/>
        <ellipse cx="38" cy="45" rx="10" ry="5" fill="#fff" opacity=".3" transform="rotate(-25 38 45)"/>
      </g>
      <path d="M54 29c3-10 13-16 24-13-2 10-11 17-24 17Z" fill="#55bd5b"/>
      <path d="M55 31c1-8 8-13 16-13-4 7-9 12-16 13Z" fill="#83df7e" opacity=".65"/>
      <path d="M53 32l-2-8" stroke="#809a45" stroke-width="3" stroke-linecap="round"/>
      <g fill="#f2c200" opacity=".45"><circle cx="39" cy="63" r="1"/><circle cx="59" cy="68" r="1.1"/><circle cx="63" cy="51" r="1"/><circle cx="47" cy="76" r=".9"/></g>
    </symbol>

    <symbol id="fruit-3" viewBox="0 0 100 100">
      <circle cx="50" cy="54" r="30" fill="url(#gKiwiSkin)"/>
      <circle cx="50" cy="54" r="26" fill="url(#gKiwiFlesh)"/>
      <circle cx="50" cy="54" r="20" fill="none" stroke="#f4ffda" stroke-width="1.5" opacity=".35"/>
      <g stroke="#e7f9bd" stroke-width="1" opacity=".6">
        <path d="M50 54V34"/><path d="M50 54l16-10"/><path d="M50 54l16 10"/><path d="M50 54v20"/>
        <path d="M50 54L34 64"/><path d="M50 54L34 44"/>
      </g>
      <circle cx="50" cy="54" r="9" fill="#f5ffdf"/>
      <g fill="#405021">
        <ellipse cx="50" cy="39" rx="1.5" ry="2.4"/><ellipse cx="62" cy="44" rx="1.5" ry="2.4" transform="rotate(35 62 44)"/>
        <ellipse cx="64" cy="56" rx="1.5" ry="2.4" transform="rotate(65 64 56)"/><ellipse cx="59" cy="67" rx="1.5" ry="2.4" transform="rotate(95 59 67)"/>
        <ellipse cx="49" cy="70" rx="1.5" ry="2.4"/><ellipse cx="38" cy="66" rx="1.5" ry="2.4" transform="rotate(-65 38 66)"/>
        <ellipse cx="34" cy="55" rx="1.5" ry="2.4" transform="rotate(-55 34 55)"/><ellipse cx="39" cy="43" rx="1.5" ry="2.4" transform="rotate(-30 39 43)"/>
      </g>
      <circle cx="50" cy="54" r="30" fill="url(#gHighlight)" opacity=".35"/>
    </symbol>

    <symbol id="fruit-4" viewBox="0 0 100 100">
      <circle cx="50" cy="57" r="28" fill="url(#gBlue)"/>
      <path d="M50 29c-2 5-4 8-8 10l8-1 2 8 2-8 8 1c-4-2-6-5-8-10Z" fill="#213f9e" opacity=".75"/>
      <path d="M50 29c-1 5-4 9-9 11 4 0 7 0 10-2 2 2 5 2 9 2-5-2-7-6-10-11Z" fill="#8bc1ff" opacity=".5"/>
      <path d="M34 45c4-3 8-4 12-4" fill="none" stroke="#d6ebff" stroke-width="2" opacity=".5" stroke-linecap="round"/>
      <ellipse cx="38" cy="42" rx="8" ry="4" fill="#fff" opacity=".2" transform="rotate(-30 38 42)"/>
      <circle cx="50" cy="57" r="28" fill="url(#gHighlight)" opacity=".3"/>
      <circle cx="61" cy="48" r="4" fill="#b9dcff" opacity=".25"/>
    </symbol>

    <symbol id="fruit-5" viewBox="0 0 100 100">
      <path d="M51 31c2-9 11-14 21-12-2 10-10 15-21 14Z" fill="#55bd5b"/>
      <path d="M51 32l-2-9" stroke="#718f42" stroke-width="3" stroke-linecap="round"/>
      <g fill="url(#gGrape)">
        <circle cx="49" cy="43" r="11"/><circle cx="37" cy="52" r="10.5"/><circle cx="61" cy="52" r="10.5"/>
        <circle cx="49" cy="59" r="10.5"/><circle cx="37" cy="68" r="9.5"/><circle cx="61" cy="68" r="9.5"/><circle cx="49" cy="74" r="9"/>
      </g>
      <g fill="#fff" opacity=".2">
        <circle cx="45" cy="39" r="3"/><circle cx="33" cy="48" r="2.5"/><circle cx="57" cy="48" r="2.5"/>
        <circle cx="45" cy="55" r="2.5"/><circle cx="33" cy="64" r="2"/><circle cx="57" cy="64" r="2"/>
      </g>
    </symbol>

    <symbol id="icon-sparkle" viewBox="0 0 100 100">
      <path d="M50 8c4 23 19 38 42 42-23 4-38 19-42 42-4-23-19-38-42-42 23-4 38-19 42-42Z" fill="currentColor"/>
      <circle cx="50" cy="50" r="8" fill="#fff" opacity=".9"/>
    </symbol>

    <symbol id="icon-sound" viewBox="0 0 24 24">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a1 1 0 0 0 1.6-.8V5.6a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1Z" fill="currentColor"/>
      <path d="M16.2 8.4a5 5 0 0 1 0 7.2M18.8 5.8a9 9 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a1 1 0 0 0 1.6-.8V5.6a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1Z" fill="currentColor"/>
      <path d="m16 9 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <rect x="6" y="4.5" width="4.5" height="15" rx="2" fill="currentColor"/>
      <rect x="13.5" y="4.5" width="4.5" height="15" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 5.6a1 1 0 0 1 1.5-.9l9.2 6.4a1 1 0 0 1 0 1.8l-9.2 6.4A1 1 0 0 1 8 18.4V5.6Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-hint" viewBox="0 0 24 24">
      <path d="M9 18h6m-5 3h4M12 2a7 7 0 0 0-4.2 12.6c.8.6 1.2 1.4 1.2 2.4h6c0-1 .4-1.8 1.2-2.4A7 7 0 0 0 12 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 7v5m0 0-2-2m2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24">
      <path d="M3 7h3.5c4.5 0 6.5 10 11 10H21m0 0-3-3m3 3-3 3M3 17h3.5c1.5 0 2.7-1 3.8-2.5M21 7h-3.5c-1.5 0-2.7 1-3.8 2.5m6.3-2.5-3-3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-restart" viewBox="0 0 24 24">
      <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.4l6.2-.9L12 2.8Z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span><span class="blob blob-b"></span><span class="blob blob-c"></span>
    <span class="ambient-fruit af-1"><svg viewBox="0 0 100 100"><use href="#fruit-3"></use></svg></span>
    <span class="ambient-fruit af-2"><svg viewBox="0 0 100 100"><use href="#fruit-1"></use></svg></span>
    <span class="ambient-fruit af-3"><svg viewBox="0 0 100 100"><use href="#fruit-5"></use></svg></span>
    <span class="ambient-fruit af-4"><svg viewBox="0 0 100 100"><use href="#fruit-0"></use></svg></span>
    <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
    <span class="bubble b4"></span><span class="bubble b5"></span><span class="bubble b6"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 100 100"><use href="#fruit-0"></use></svg><i class="brand-spark">✦</i></span>
      <div class="brand-text">
        <h1>果漾消消乐</h1>
        <p>FRUIT SPLASH</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true">
        <svg viewBox="0 0 24 24"><use href="#icon-sound" id="soundIconUse"></use></svg>
      </button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停游戏">
        <svg viewBox="0 0 24 24"><use href="#icon-pause"></use></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <div class="game-layout">
      <section class="board-section" aria-label="游戏区域">
        <div class="hud">
          <div class="hud-pill hud-level">
            <span>LEVEL</span>
            <strong id="levelNum">01</strong>
          </div>
          <div class="hud-pill hud-moves" id="movesPill">
            <span>剩余步数</span>
            <strong id="movesNum">24</strong>
          </div>
          <div class="hud-score">
            <div class="hud-score-line">
              <span>本关得分</span>
              <strong id="scoreNum">0</strong>
              <em>/ <span id="hudTarget">5,000</span></em>
            </div>
            <div class="progress-track" role="progressbar" aria-label="关卡进度" aria-valuemin="0" aria-valuemax="5000" aria-valuenow="0" id="hudProgress">
              <i id="progressFill"></i>
            </div>
          </div>
        </div>

        <div class="board-frame">
          <div class="board" id="board" aria-label="消消乐棋盘">
            <div class="board-grid" id="boardGrid"></div>
            <div class="tile-layer" id="tileLayer"></div>
            <div class="effects" id="effects"></div>
            <div class="board-gloss" aria-hidden="true"></div>
          </div>
          <div class="combo-banner" id="comboBanner" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button class="control-btn" id="hintBtn" type="button">
            <svg viewBox="0 0 24 24"><use href="#icon-hint"></use></svg>
            <span>提示</span><b id="hintCount">3</b>
          </button>
          <button class="control-btn" id="shuffleBtn" type="button">
            <svg viewBox="0 0 24 24"><use href="#icon-shuffle"></use></svg>
            <span>洗牌</span><b id="shuffleCount">2</b>
          </button>
          <button class="control-btn" id="restartBtn" type="button">
            <svg viewBox="0 0 24 24"><use href="#icon-restart"></use></svg>
            <span>重开</span>
          </button>
        </div>
      </section>

      <aside class="side-panel" aria-label="关卡信息">
        <div class="panel mission-panel">
          <div class="panel-head">
            <span>本关目标</span>
            <div class="level-tag">LV.<b id="sideLevel">1</b></div>
          </div>
          <div class="target-line">
            <span class="target-star"><svg viewBox="0 0 24 24"><use href="#icon-star"></use></svg></span>
            <strong id="targetNum">5000</strong>
          </div>
          <div class="progress-track side-progress">
            <i id="sideProgress"></i>
          </div>
          <div class="mission-meta">
            <span>已获得 <b id="sideScore">0</b></span>
            <span id="progressPercent">0%</span>
          </div>
        </div>

        <div class="panel stats-panel">
          <div class="stat-item">
            <span>最高单关</span>
            <strong id="bestScore">0</strong>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span>最高连击</span>
            <strong>×<span id="comboBest">1</span></strong>
          </div>
        </div>

        <div class="panel tip-panel">
          <h2>果汁秘籍</h2>
          <div class="tip-row">
            <span class="mini-tile"><svg viewBox="0 0 100 100"><use href="#fruit-0"></use></svg></span>
            <p><b>三个相连</b><br>交换相邻水果即可消除</p>
          </div>
          <div class="tip-row">
            <span class="mini-tile stripe-demo"><svg viewBox="0 0 100 100"><use href="#fruit-1"></use></svg></span>
            <p><b>四连条纹</b><br>生成整行或整列爆破水果</p>
          </div>
          <div class="tip-row">
            <span class="mini-tile rainbow-demo"><svg viewBox="0 0 100 100"><use href="#icon-sparkle"></use></svg></span>
            <p><b>五连彩虹</b><br>与任意水果交换，清空同类</p>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">拖拽或点击交换 · 连击可获得更高分数 · 四连、五连会生成特殊水果</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="overlay" id="overlay" aria-modal="true" role="dialog">
    <div class="overlay-card" id="overlayCard"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
